<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriScan | Tu comida en números</title>
<style>
:root{--green:#087647;--dark:#075735;--mint:#e8f7ef;--bg:#f5f8f6;--text:#18352a;--muted:#6c8076;--line:#e0ebe5;--orange:#f4a62a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1120px;margin:auto;min-height:100vh}.top{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}.topin{max-width:1120px;margin:auto;padding:15px 22px;display:flex;align-items:center;gap:14px}.logo{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:850;color:var(--green);white-space:nowrap}.leaf{background:var(--mint);border-radius:13px;padding:8px;font-size:22px}.search{flex:1;min-width:90px;border:1px solid var(--line);background:#f8fbf9;padding:12px 15px;border-radius:14px;outline-color:var(--green)}.user{border:0;background:var(--mint);color:var(--dark);padding:10px 13px;border-radius:12px;font-weight:700}.layout{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:24px 22px}.side{background:white;border:1px solid var(--line);border-radius:20px;padding:14px;height:max-content;position:sticky;top:85px}.nav{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:13px;border-radius:12px;margin:3px 0;font-weight:700}.nav.active,.nav:hover{background:var(--mint);color:var(--green)}.sidehint{font-size:12px;color:var(--muted);line-height:1.5;padding:14px 8px 4px}.hero{background:linear-gradient(120deg,#075735,#0b8954);border-radius:22px;color:white;padding:25px;display:flex;justify-content:space-between;gap:15px;align-items:center;overflow:hidden}.hero h1{font-size:clamp(23px,3vw,34px);margin:0 0 8px}.hero p{margin:0;color:#d8f5e5;line-height:1.5}.heroicon{font-size:65px;background:#ffffff20;border-radius:22px;padding:14px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 13px}.sectionhead h2{margin:0;font-size:20px}.muted{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px}.stat,.panel,.foodcard{background:white;border:1px solid var(--line);border-radius:17px;padding:16px}.stat small{color:var(--muted);display:block;margin-bottom:9px}.stat strong{font-size:23px}.stat em{font-style:normal;color:var(--muted);font-size:12px}.progress{height:7px;background:#eaf1ed;border-radius:20px;overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;background:var(--green);border-radius:20px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.chip{border:1px solid var(--line);background:white;color:var(--muted);padding:9px 14px;border-radius:30px}.chip.active{background:var(--green);border-color:var(--green);color:white}.foods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.foodcard{padding:0;overflow:hidden;cursor:pointer;transition:.15s}.foodcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px #0b513010}.foodpic{height:125px;background:linear-gradient(135deg,#e7f6ec,#fff4df);display:grid;place-items:center;font-size:64px}.foodbody{padding:14px}.foodtitle{font-weight:800;margin-bottom:5px}.foodmeta{font-size:12px;color:var(--muted);line-height:1.6}.score{display:inline-flex;align-items:center;gap:5px;font-weight:800;margin-top:9px;color:var(--green)}.score.low{color:#d56a20}.score.mid{color:#b07a11}.btn{border:0;background:var(--green);color:white;padding:11px 15px;border-radius:12px;font-weight:750}.btn:hover{background:var(--dark)}.btn.secondary{background:var(--mint);color:var(--green)}.btn.ghost{background:white;border:1px solid var(--line);color:var(--text)}.hidden{display:none!important}.view{min-width:0}.detail{display:grid;grid-template-columns: minmax(0,1fr) minmax(0,1fr);gap:18px}.detailpic{border-radius:18px;background:linear-gradient(135deg,#e4f7eb,#fff1d9);display:grid;place-items:center;font-size:100px;min-height:220px}.nutrients{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0}.nut{background:#f5faf7;padding:13px;border-radius:12px}.nut strong{display:block;font-size:20px;margin:5px 0}.nut small{color:var(--muted)}.review{padding:14px 0;border-bottom:1px solid var(--line)}.review:last-child{border:0}.reviewtop{display:flex;justify-content:space-between;gap:8px;font-weight:700}.stars{color:var(--orange);letter-spacing:1px}.formrow{display:grid;gap:7px;margin:12px 0}.formrow label{font-size:13px;font-weight:750}.formrow input,.formrow select,.formrow textarea{border:1px solid var(--line);border-radius:12px;padding:12px;background:white;width:100%;outline-color:var(--green)}.formrow textarea{min-height:90px;resize:vertical}.notice{font-size:12px;color:var(--muted);line-height:1.5;margin-top:12px}.empty{padding:30px;text-align:center;color:var(--muted);background:white;border-radius:15px;border:1px dashed var(--line)}.mobileNav{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173b2b;color:white;padding:12px 18px;border-radius:12px;z-index:10;box-shadow:0 6px 24px #0002}
@media(max-width:850px){.layout{grid-template-columns:1fr;padding:16px}.side{display:none}.foods{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.topin{padding:12px 15px}.logo{font-size:18px}.user{display:none}.mobileNav{display:flex;position:sticky;bottom:0;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:8px;z-index:5}.mobileNav .nav{justify-content:center;flex-direction:column;gap:2px;padding:7px;font-size:11px;margin:0}.detail{grid-template-columns:1fr}.detailpic{min-height:160px}}
@media(max-width:430px){.foods{grid-template-columns:1fr 1fr;gap:9px}.foodpic{height:90px;font-size:46px}.foodbody{padding:10px}.foodtitle{font-size:14px}.foodmeta{font-size:11px}.heroicon{font-size:43px;padding:9px}.stat{padding:12px}.stat strong{font-size:19px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="logo"><span class="leaf">🌿</span> NutriScan</div><input id="search" class="search" placeholder="Buscar papas, bebidas, frutas..." aria-label="Buscar alimentos"><button class="user" onclick="showView('profile')">Mi perfil</button></div></header>
<div class="app"><div class="layout"><aside class="side">
<button class="nav active" data-view="home" onclick="showView('home')">🏠 &nbsp; Inicio</button>
<button class="nav" data-view="explore" onclick="showView('explore')">🔎 &nbsp; Explorar alimentos</button>
<button class="nav" data-view="history" onclick="showView('history')">📊 &nbsp; Mi registro</button>
<button class="nav" data-view="reviews" onclick="showView('reviews')">⭐ &nbsp; Reseñas</button>
<button class="nav" data-view="profile" onclick="showView('profile')">👤 &nbsp; Mi perfil</button>
<div class="sidehint">Los datos nutricionales son aproximados y pueden variar según la marca y la porción. Revisa siempre el envase.</div>
</aside><main class="view" id="main"></main></div>
<nav class="mobileNav"><button class="nav active" data-view="home" onclick="showView('home')">🏠<span>Inicio</span></button><button class="nav" data-view="explore" onclick="showView('explore')">🔎<span>Explorar</span></button><button class="nav" data-view="history" onclick="showView('history')">📊<span>Registro</span></button><button class="nav" data-view="reviews" onclick="showView('reviews')">⭐<span>Reseñas</span></button><button class="nav" data-view="profile" onclick="showView('profile')">👤<span>Perfil</span></button></nav>
</div><div id="toast" class="toast hidden"></div>
<script>
const foods=[
{id:1,name:'Papas fritas',brand:'Porción de 100 g',cat:'Snacks',emoji:'🍟',kcal:312,fat:15,sugar:0,carbs:41,protein:3,salt:0.6,score:3.2,desc:'Snack crujiente; suele contener bastante grasa y sal.'},
{id:2,name:'Bebida cola',brand:'Lata de  lata / 330 ml',cat:'Bebidas',emoji:'🥤',kcal:139,fat:0,sugar:35,carbs:35,protein:0,salt:0.03,score:2.1,desc:'Bebida azucarada. La versión sin azúcar tiene otros valores nutricionales.'},
{id:3,name:'Agua natural',brand:'Vaso de 250 ml',cat:'Bebidas',emoji:'💧',kcal:0,fat:0,sugar:0,carbs:0,protein:0,salt:0,score:10,desc:'Ayuda a mantener la hidratación sin añadir azúcar.'},
{id:4,name:'Jugo de naranja',brand:'Vaso de 250 ml',cat:'Bebidas',emoji:'🧃',kcal:112,fat:0.5,sugar:21,carbs:26,protein:2,salt:0.01,score:4.8,desc:'Aporta vitamina C, pero el jugo puede concentrar azúcares y aporta menos fibra que la fruta entera.'},
{id:5,name:'Hamburguesa',brand:'1 unidad mediana',cat:'Comidas',emoji:'🍔',kcal:280,fat:14,sugar:5,carbs:30,protein:13,salt:1.1,score:5.8,desc:'Sus valores cambian bastante según el tamaño, los ingredientes y las salsas.'},
{id:6,name:'Pollo a la plancha',brand:'Porción de 100 g',cat:'Comidas',emoji:'🍗',kcal:165,fat:3.6,sugar:0,carbs:0,protein:31,salt:0.1,score:8.5,desc:'Fuente de proteínas; el acompañamiento y la preparación también importan.'},
{id:7,name:'Ensalada mixta',brand:'1 plato mediano',cat:'Comidas',emoji:'🥗',kcal:120,fat:6,sugar:5,carbs:12,protein:3,salt:0.3,score:7.8,desc:'Puede aportar fibra y variedad de vegetales. El aliño modifica sus valores.'},
{id:8,name:'Manzana',brand:'1 unidad mediana',cat:'Frutas',emoji:'🍎',kcal:95,fat:0.3,sugar:19,carbs:25,protein:0.5,salt:0,score:9.2,desc:'Fruta que aporta fibra y agua; sus azúcares son naturalmente presentes.'},
{id:9,name:'Papas chips',brand:'Bolsa de 30 g',cat:'Snacks',emoji:'🥔',kcal:160,fat:10,sugar:0.5,carbs:15,protein:2,salt:0.17,score:3.5,desc:'Snack que suele aportar bastante sal y grasa para una porción pequeña.'},
{id:10,name:'Yogur natural',brand:'Envase de 125 g',cat:'Lácteos',emoji:'🥣',kcal:85,fat:3,sugar:6,carbs:7,protein:5,salt:0.1,score:8.1,desc:'Aporta proteínas y calcio; revisa si tiene azúcar añadida.'},
{id:11,name:'Bebida energética',brand:'Lata de 250 ml',cat:'Bebidas',emoji:'⚡',kcal:110,fat:0,sugar:27,carbs:27,protein:0,salt:0.2,score:3.0,desc:'Puede contener cafeína y azúcar. No es necesaria para hidratarse.'},
{id:12,name:'Salmón al horno',brand:'Porción de 100 g',cat:'Comidas',emoji:'🐟',kcal:206,fat:12,sugar:0,carbs:0,protein:22,salt:0.1,score:8.8,desc:'Aporta proteínas y grasas saludables, incluidos omega-3.'}
];
let reviews=JSON.parse(localStorage.getItem('nutriscan_reviews')||'{}');
let logs=JSON.parse(localStorage.getItem('nutriscan_logs')||'[]');
let activeCat='Todos',currentFood=null,view='home';
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function scoreClass(s){return s<4?'low':s<7?'mid':''}
function getReviews(id){return reviews[id]||[]}
function avgScore(f){let r=getReviews(f.id);return r.length?(r.reduce((a,x)=>a+x.rating,0)/r.length).toFixed(1):f.score.toFixed(1)}
function foodCard(f){return `<article class="foodcard" onclick="openFood(${f.id})"><div class="foodpic">${f.emoji}</div><div class="foodbody"><div class="foodtitle">${f.name}</div><div class="foodmeta">${f.brand}<br>${f.kcal} kcal · ${f.fat} g grasas<br>${f.sugar} g azúcares</div><div class="score ${scoreClass(Number(avgScore(f)))}">★ ${avgScore(f)}/10</div></div></article>`}
function header(title,sub=''){return `<div class="sectionhead"><div><h2>${title}</h2>${sub?`<div class="muted">${sub}</div>`:''}</div></div>`}
function renderHome(){let total=logs.reduce((a,x)=>({kcal:a.kcal+x.kcal,fat:a.fat+x.fat,sugar:a.sugar+x.sugar}),{kcal:0,fat:0,sugar:0});let cats=['Comidas','Snacks','Bebidas','Frutas','Lácteos'];return `<section class="hero"><div><h1>Come informado, a tu manera 🌱</h1><p>Consulta calorías, grasas, azúcares y la puntuación<br>orientativa de tus alimentos.</p><button class="btn" style="margin-top:17px;background:white;color:#075735" onclick="showView('explore')">Explorar alimentos →</button></div><div class="heroicon">🥑</div></section>${header('Tu registro de hoy','Se actualiza cuando agregas alimentos al registro')}<div class="stats"><div class="stat"><small>🔥 Calorías</small><strong>${total.kcal}</strong> <em>kcal</em><div class="progress"><span style="width:${Math.min(100,total.kcal/2000*100)}%"></span></div></div><div class="stat"><small>🧈 Grasas</small><strong>${total.fat.toFixed(1)}</strong> <em>g</em><div class="progress"><span style="width:${Math.min(100,total.fat/70*100)}%"></span></div></div><div class="stat"><small>🍬 Azúcares</small><strong>${total.sugar.toFixed(1)}</strong> <em>g</em><div class="progress"><span style="width:${Math.min(100,total.sugar/50*100)}%"></span></div></div><div class="stat"><small>🍽️ Registrados</small><strong>${logs.length}</strong> <em>alimentos</em></div></div>${header('Explora por categoría')}<div class="chips">${['Todos',...cats].map(c=>`<button class="chip" onclick="activeCat='${c}';showView('explore')">${c}</button>`).join('')}</div>${header('Productos populares','Toca un producto para ver sus datos y reseñas')}<div class="foods">${foods.slice(0,6).map(foodCard).join('')}</div><p class="notice">Nota: la puntuación es orientativa para este prototipo, no un diagnóstico ni una recomendación médica. Una alimentación saludable depende del conjunto de hábitos, las porciones y las necesidades personales.</p>`}
function renderExplore(){let q=$('search').value.toLowerCase().trim();let list=foods.filter(f=>(activeCat==='Todos'||f.cat===activeCat)&&(f.name+' '+f.cat+' '+f.brand).toLowerCase().includes(q));return `${header('Explorar alimentos','Compara información nutricional por porción')}<div class="chips">${['Todos','Comidas','Snacks','Bebidas','Frutas','Lácteos'].map(c=>`<button class="chip ${activeCat===c?'active':''}" onclick="activeCat='${c}';render()">${c}</button>`).join('')}</div><div class="foods">${list.map(foodCard).join('')||'<div class="empty">No encontramos productos. Prueba con otra búsqueda.</div>'}</div><p class="notice">Los valores son ejemplos aproximados para las porciones indicadas. En productos envasados, compara la etiqueta de la marca específica.</p>`}
function openFood(id){currentFood=foods.find(f=>f.id===id);view='detail';render();window.scrollTo({top:0,behavior:'smooth'})}
function renderDetail(){let f=currentFood;if(!f)return renderExplore();let rs=getReviews(f.id);return `<button class="btn ghost" onclick="showView('explore')">← Volver a alimentos</button><div class="panel" style="margin-top:14px"><div class="detail"><div class="detailpic">${f.emoji}</div><div><div class="muted">${f.cat} · ${f.brand}</div><h1 style="margin:8px 0">${f.name}</h1><div class="score ${scoreClass(Number(avgScore(f)))}" style="font-size:22px">★ ${avgScore(f)}/10</div><div class="muted">${rs.length} reseña(s) · puntuación orientativa</div><p>${f.desc}</p><button class="btn" onclick="addLog(${f.id})">＋ Agregar a mi registro</button></div></div><div class="nutrients"><div class="nut">🔥 <small>Calorías</small><strong>${f.kcal} kcal</strong><small>por porción</small></div><div class="nut">🧈 <small>Grasas</small><strong>${f.fat} g</strong><small>por porción</small></div><div class="nut">🍬 <small>Azúcares</small><strong>${f.sugar} g</strong><small>por porción</small></div><div class="nut">🌾 <small>Carbohidratos</small><strong>${f.carbs} g</strong><small>por porción</small></div><div class="nut">💪 <small>Proteínas</small><strong>${f.protein} g</strong><small>por porción</small></div><div class="nut">🧂 <small>Sal</small><strong>${f.salt} g</strong><small>por porción</small></div></div></div>${header('Deja tu reseña','Comparte tu opinión con respeto')}<div class="panel"><form onsubmit="submitReview(event,${f.id})"><div class="formrow"><label for="reviewName">Tu nombre o apodo</label><input id="reviewName" maxlength="24" placeholder="Ej. Vale23" required></div><div class="formrow"><label for="reviewRating">Tu puntuación</label><select id="reviewRating" required><option value="">Elige del 0 al 10</option>${Array.from({length:11},(_,i)=>`<option value="${i}">${i}/10</option>`).join('')}</select></div><div class="formrow"><label for="reviewText">Comentario</label><textarea id="reviewText" maxlength="300" placeholder="¿Qué te parece este producto?" required></textarea></div><button class="btn" type="submit">Publicar reseña</button></form><p class="notice">Las reseñas se guardan en este navegador en esta versión de demostración. No se publican en internet ni se comparten con otros dispositivos.</p></div>${header('Opiniones de usuarios')}<div class="panel">${rs.length?rs.slice().reverse().map(r=>`<div class="review"><div class="reviewtop"><span>${esc(r.name)}</span><span class="stars">★ ${r.rating}/10</span></div><p style="margin:8px 0">${esc(r.text)}</p><div class="muted">${esc(r.date)}</div></div>`).join(''):'<div class="empty">Todavía no hay reseñas. ¡Sé el primero en opinar!</div>'}</div>`}
function submitReview(e,id){e.preventDefault();let name=$('reviewName').value.trim(),text=$('reviewText').value.trim(),rating=Number($('reviewRating').value);if(!name||!text||$('reviewRating').value===''){toast('Completa todos los campos antes de publicar.');return}reviews[id]=reviews[id]||[];reviews[id].push({name,text,rating,date:new Date().toLocaleDateString('es-CL')});localStorage.setItem('nutriscan_reviews',JSON.stringify(reviews));toast('¡Reseña guardada en este dispositivo!');render()}
function addLog(id){let f=foods.find(x=>x.id===id);logs.push({id:f.id,name:f.name,kcal:f.kcal,fat:f.fat,sugar:f.sugar,time:new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})});localStorage.setItem('nutriscan_logs',JSON.stringify(logs));toast('Alimento agregado a tu registro');render()}
function renderHistory(){let total=logs.reduce((a,x)=>({kcal:a.kcal+x.kcal,fat:a.fat+x.fat,sugar:a.sugar+x.sugar}),{kcal:0,fat:0,sugar:0});return `${header('Mi registro','Alimentos que has agregado durante esta sesión')}<div class="stats"><div class="stat"><small>Calorías</small><strong>${total.kcal}</strong> <em>kcal</em></div><div class="stat"><small>Grasas</small><strong>${total.fat.toFixed(1)}</strong> <em>g</em></div><div class="stat"><small>Azúcares</small><strong>${total.sugar.toFixed(1)}</strong> <em>g</em></div><div class="stat"><small>Alimentos</small><strong>${logs.length}</strong></div></div>${header('Alimentos registrados')}<div class="panel">${logs.length?logs.slice().reverse().map((x,i)=>`<div class="review" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><strong>${esc(x.name)}</strong><div class="muted">${x.time} · ${x.kcal} kcal · ${x.fat} g grasa · ${x.sugar} g azúcar</div></div><button class="btn ghost" onclick="removeLog(${logs.length-1-i})">Quitar</button></div>`).join(''):'<div class="empty">Aún no has registrado alimentos.<br><button class="btn" style="margin-top:12px" onclick="showView(&quot;explore&quot;)">Explorar alimentos</button></div>'}<button class="btn ghost" style="margin-top:14px" onclick="clearLogs()">Borrar registro</button></div><p class="notice">Los totales son únicamente la suma de los alimentos que agregaste. No representan una meta nutricional personalizada.</p>`}
function removeLog(i){logs.splice(i,1);localStorage.setItem('nutriscan_logs',JSON.stringify(logs));render()}
function clearLogs(){if(confirm('¿Quieres borrar todo el registro?')){logs=[];localStorage.setItem('nutriscan_logs','[]');render()}}
function renderReviews(){let all=foods.flatMap(f=>getReviews(f.id).map(r=>({...r,food:f.name,id:f.id}))).reverse();return `${header('Reseñas de la comunidad','Opiniones compartidas en este dispositivo')}<div class="panel">${all.length?all.map(r=>`<div class="review"><div class="reviewtop"><span>${esc(r.name)} · <a href="#" onclick="openFood(${r.id});return false" style="color:var(--green)">${esc(r.food)}</a></span><span class="stars">★ ${r.rating}/10</span></div><p>${esc(r.text)}</p><div class="muted">${esc(r.date)}</div></div>`).join(''):'<div class="empty">Todavía no hay reseñas.<br>Entra en un producto para dejar la primera.</div>'}</div>`}
function renderProfile(){return `${header('Mi perfil','Personaliza tu experiencia')}<div class="panel"><div style="font-size:45px">👋</div><h2>¡Hola!</h2><p>Esta es una demostración de NutriScan. Puedes explorar alimentos, revisar datos nutricionales, dejar reseñas y llevar un registro de lo que agregas.</p><button class="btn" onclick="showView('explore')">Comenzar a explorar</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Acerca de la puntuación</h3><p>La nota de 0 a 10 es orientativa y está precargada para demostrar la idea. No es una clasificación oficial ni sustituye el consejo de un profesional de salud.</p><h3>Privacidad de la demo</h3><p>Las reseñas y el registro se guardan en el almacenamiento local de este navegador. No hay cuentas reales ni base de datos compartida.</p><button class="btn ghost" onclick="if(confirm('¿Borrar reseñas y registro de este navegador?')){reviews={};logs=[];localStorage.removeItem('nutriscan_reviews');localStorage.removeItem('nutriscan_logs');render();toast('Datos locales borrados')}">Borrar mis datos locales</button></div>`}
function showView(v){view=v;if(v!=='detail')currentFood=null;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){let main=$('main');if(view==='home')main.innerHTML=renderHome();else if(view==='explore')main.innerHTML=renderExplore();else if(view==='detail')main.innerHTML=renderDetail();else if(view==='history')main.innerHTML=renderHistory();else if(view==='reviews')main.innerHTML=renderReviews();else main.innerHTML=renderProfile()}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2300)}
$('search').addEventListener('input',()=>{if(view!=='explore')showView('explore');else render()});
render();
</script></body></html>
